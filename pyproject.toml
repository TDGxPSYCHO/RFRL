[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-spectrum-rl"
version = "0.1.0"
description = "Starter RF spectrum simulation environment for RL-based sensing and dynamic spectrum access."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
dev = [
    "pytest>=8.0",
]
viz = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
